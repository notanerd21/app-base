name: build app-base

# Only on purpose (Nenad 09.11.: "better stay the same version till we update it manually, otherwise maybe it breaks"):
# a change to the Dockerfile, or by hand (Actions → build app-base → Run workflow). No schedule. Pushes
# :node22-YYYYMMDD (fixed tag — the apps pin THIS, so a new build changes nothing until an app is switched on purpose)
# and :node22 (moving tag, for trying the newest).
on:
  push:
    branches: [main]
    paths: ["Dockerfile", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: date
        run: echo "d=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          pull: true
          tags: |
            ghcr.io/notanerd21/app-base:node22
            ghcr.io/notanerd21/app-base:node22-${{ steps.date.outputs.d }}
          labels: |
            org.opencontainers.image.source=https://github.com/notanerd21/app-base
            org.opencontainers.image.description=Shared runtime base for the app-host apps (Chrome, weasyprint, ffmpeg, libvips, fonts)
