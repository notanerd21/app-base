name: build app-base

# Automatic: the 1st of every month (security updates in the OS packages), on every change to the Dockerfile,
# or by hand (Actions → build app-base → Run workflow). Pushes ghcr.io/notanerd21/app-base:node22 (moving tag the apps
# use) and :node22-YYYYMMDD (fixed tag to roll back to).
on:
  schedule:
    - cron: "0 3 1 * *"
  push:
    branches: [main]
    paths: ["Dockerfile", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: date
        run: echo "d=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          pull: true
          tags: |
            ghcr.io/notanerd21/app-base:node22
            ghcr.io/notanerd21/app-base:node22-${{ steps.date.outputs.d }}
          labels: |
            org.opencontainers.image.source=https://github.com/notanerd21/app-base
            org.opencontainers.image.description=Shared runtime base for the app-host apps (Chrome, weasyprint, ffmpeg, libvips, fonts)
